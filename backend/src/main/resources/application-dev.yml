#database configurations

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:docmind}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
      #Automatically updates your database schema (tables, columns) to match your Java @Entity classes when the app starts. It won't delete existing data, but it will add new tables/columns.
    show-sql: true
    # Logs every SQL query executed by Hibernate directly to the console.
    properties:
      hibernate:
        format_sql: true
        #Formats the console-logged SQL queries nicely across multiple lines so they are easy for developers to read.


  #open ai configurations
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}

        chat:
          model: gemini-2.5-flash
          temperature: 0.2

        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            model: text-embedding-004


      # FIXED INDENTATION: Nested vectorstore inside openai where Spring AI expects it
      vectorstore:
        pgvector:
          index-type: HNSW
          #ai.openai.vectorstore.pgvector.index-type: HNSW: Uses the Hierarchical Navigable Small World (HNSW) indexing algorithm. This creates a graph-based index that enables lightning-fast approximate nearest neighbor searches.
          distance-type: COSINE_DISTANCE
          #: Measures vector similarity using Cosine Distance. It calculates the angle between two vectors to see how contextually similar two pieces of text are, ignoring text length.
          dimensions: 768
          #he length of the vector array. 768 matches the exact output dimensions generated by the text-embedding-3-small model.
          table-name: vector_store
          #The name of the database table where Spring AI will save the embedded text chunks.
          schema-name: public
          #public: The PostgreSQL database schema where the table lives.
          initialize-schema: true
          #ells Spring Boot to automatically run the database scripts to install the pgvector extension and create the vector_store table if they don't already exist.

  # FIXED INDENTATION: Moved servlet outside of ai block to sit directly under spring
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB



#app configurations
app:
  rag:
    chunk-size: 700
    #app.rag.chunk-size: 700: When parsing a large document (like a PDF), the system splits it into smaller snippets of 700 tokens/characters before embedding them.
#    chunk-overlap: 100     (Commented out) If active, it would overlap adjacent chunks by 100 characters to prevent cutting off sentences mid-thought across chunk boundaries.
    top-k: 5
    #When a user asks a question, the vector database will fetch the top 5 most relevant document chunks to feed to the LLM as context.
    similarity-threshold: 0.0
    #app.rag.similarity-threshold: 0.0: The minimum matching score required to retrieve a chunk. Set to 0.0, meaning it will return the closest 5 chunks regardless of how poor the match quality is.

  cors:
    allowed-origins: "*"
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    #app.cors.allowed-headers: "*": Allows external clients to send any custom HTTP headers (like Authorization) in their API requests.


#jwt configurations


jwt:
  secret: ${JWT_SECRET:sdafasfasfasdhfojhascapfdaDHAfbashfabfashfasbfshfdasfhqf}
  expiration: 3600000


bootui:
  enabled: ON


logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG
#logging.level.org.springframework.ai.chat.client.advisor: DEBUG: Changes the logging verbosity for Spring AI Advisors to the DEBUG level. This will print deep internal steps to your console—such as the exact prompt modifications, memory injection, and context retrieval history—making it incredibly helpful for debugging RAG prompt flows.
